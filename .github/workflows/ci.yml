name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # No requiere DB: prisma generate solo lee prisma/schema.prisma
      - run: npx prisma generate

      - run: npm run lint

      - run: npm run type-check
